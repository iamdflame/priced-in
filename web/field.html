<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Priced In · the field (review)</title>
<style>
  @font-face { font-family: "Amstelvar"; src: url("/fonts/amstelvar-roman.woff2") format("woff2"); font-style: normal; font-weight: 100 1000; font-display: block; }
  @font-face { font-family: "Amstelvar"; src: url("/fonts/amstelvar-italic.woff2") format("woff2"); font-style: italic; font-weight: 100 1000; font-display: block; }
  :root {
    --paper: oklch(0.975 0.004 255); --ink-9: oklch(0.20 0.035 265); --ink-5: oklch(0.50 0.05 265);
    --ink-3: oklch(0.74 0.03 265); --night: oklch(0.25 0.04 265); --red: oklch(0.62 0.21 32);
    --red-text: oklch(0.54 0.2 32); --beat: 400ms; --pad: clamp(20px, 4.4vw, 64px);
  }
  html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink-9); overflow: hidden; }
  body { font-family: "Amstelvar", Georgia, serif; }
  #field { position: fixed; inset: 0; display: block; }
  /* a stand-in for the hero above the field, only so the aim has somewhere to land */
  .hero { position: fixed; left: var(--pad); right: var(--pad); top: 0; pointer-events: none; }
  .line { font-size: clamp(54px, 10.4vw, 150px); line-height: 0.92; letter-spacing: -0.01em; font-variation-settings: "opsz" 144, "wght" 230, "wdth" 100; margin: 0; }
  .bowl { position: fixed; width: 0.34em; height: 0.34em; border-radius: 999px; border: 2px solid var(--ink-9); overflow: hidden; background: var(--paper); transform: translate(-50%, -50%); font-size: clamp(54px, 10.4vw, 150px); }
  .bowl i { position: absolute; left: 0; right: 0; bottom: 0; height: 18%; background: var(--ink-9); }
  .price { position: fixed; font-size: clamp(56px, 7vw, 108px); font-variation-settings: "opsz" 144, "wght" 200; line-height: 1; }
  .ui { position: fixed; right: 12px; top: 12px; z-index: 5; display: flex; flex-wrap: wrap; gap: 6px; max-width: 520px; justify-content: flex-end; font: 14px/1.2 system-ui, sans-serif; }
  .ui button { font: inherit; padding: 6px 10px; border: 1px solid #0003; background: #fff; border-radius: 0; cursor: pointer; }
  .ui button[aria-pressed="true"] { background: var(--ink-9); color: var(--paper); }
  .ui .ms { width: 100%; text-align: right; color: #0008; }
  body.clean .ui { display: none; }
</style>
</head>
<body>
<canvas id="field" aria-label="A field of radio dishes, each an AI agent, listening to the sentence"></canvas>
<div class="hero" aria-hidden="true">
  <p class="line" id="l1" style="margin-top: 11vh">Agents now do</p>
  <p class="line" id="l2">most of it</p>
</div>
<div class="bowl" id="bowl"><i></i></div>
<div class="price" id="price">18%</div>
<div class="ui" id="ui">
  <button data-a="stare">stare</button>
  <button data-a="aim">aim at bowl</button>
  <button data-a="names">assign names</button>
  <button data-a="yes">pulse yes</button>
  <button data-a="no">pulse no</button>
  <button data-a="hidden">yours: hidden</button>
  <button data-a="construction">yours: construction</button>
  <button data-a="red">yours: red</button>
  <button data-a="yoursno">your doubt</button>
  <button data-a="flinch">flinch</button>
  <button data-a="still">still()</button>
  <button data-a="reduced" aria-pressed="false">reduced motion</button>
  <button data-a="seed">new seed</button>
  <div class="ms" id="ms"></div>
</div>
<script type="module">
  import { createField } from "/src/ui/field/index.ts";

  const q = new URLSearchParams(location.search);
  if (q.get("ui") === "0") document.body.classList.add("clean");
  const canvas = document.getElementById("field");
  let seed = Number(q.get("seed") || 7);
  let reduced = q.get("reduced") === "1" || matchMedia("(prefers-reduced-motion: reduce)").matches;
  let field;
  const AGENTS = [
    ["archivist", "archivist", true], ["skeptic", "skeptic", true], ["quant", "quant", true],
    ["lantern", "lantern.near", false], ["tide", "tide.near", false], ["zk-owl", "zk-owl.near", false],
    ["meridian", "meridian.near", false],
  ];

  function place() {
    const w = innerWidth, h = innerHeight, phone = w < 720;
    const groundTop = Math.round(h * (phone ? 0.69 : 0.665));
    // seat the stand-in bowl at the end of the second line
    const l2 = document.getElementById("l2");
    const r = l2.getBoundingClientRect();
    const range = document.createRange(); range.selectNodeContents(l2);
    const rr = range.getBoundingClientRect();
    const fs = parseFloat(getComputedStyle(l2).fontSize);
    const bx = rr.right + fs * 0.2, by = r.top + fs * 0.76;
    const bowl = document.getElementById("bowl");
    bowl.style.left = bx + "px"; bowl.style.top = by + "px";
    const price = document.getElementById("price");
    price.style.left = (phone ? 20 : bx + fs * 0.32) + "px";
    price.style.top = (phone ? by + fs * 0.45 : by - fs * 0.42) + "px";
    return { w, h, groundTop, bx, by };
  }

  let geo;
  function make() {
    field?.destroy();
    geo = place();
    const phone = geo.w < 720;
    field = createField(canvas, {
      dishes: phone ? 30 : 64, seed, reducedMotion: reduced,
      palette: { paper: "oklch(0.975 0.004 255)", ink: "oklch(0.20 0.035 265)", night: "oklch(0.25 0.04 265)", haze: "oklch(0.74 0.03 265)", red: "oklch(0.62 0.21 32)", redText: "oklch(0.54 0.2 32)" },
    });
    field.layout({ w: geo.w, h: geo.h, dpr: devicePixelRatio || 1 }, geo.groundTop);
    window.field = field;
  }

  const act = {
    stare: (b) => field.lookAt("viewer", b == null ? undefined : { beats: b }),
    aim: (b) => field.aimAt(geo.bx, geo.by, b == null ? undefined : { beats: b }),
    names: () => AGENTS.forEach(([id, n, h]) => field.assign(id, n, h)),
    yes: () => field.pulse("quant", "yes"),
    no: () => field.pulse("skeptic", "no"),
    hidden: () => field.yours("hidden"),
    construction: () => field.yours("construction"),
    red: () => field.yours("red"),
    yoursno: () => { field.yours("red"); field.pulse("yours", "no"); },
    flinch: () => field.flinch(),
    still: () => { const img = field.still(); window.lastStill = img ? [img.width, img.height] : null; },
    reduced: () => { reduced = !reduced; make(); },
    seed: () => { seed = (seed * 7 + 13) % 997; make(); },
  };
  window.act = act;
  window.geo = () => geo;
  document.getElementById("ui").addEventListener("click", (e) => {
    const a = e.target.closest("button")?.dataset.a;
    if (!a) return;
    act[a]();
    if (a === "reduced") e.target.setAttribute("aria-pressed", String(reduced));
  });
  addEventListener("resize", () => make());
  await document.fonts.load('italic 15px "Amstelvar"');
  await document.fonts.load('150px "Amstelvar"');
  make();
  // ?state= puts the page straight into a state, settled, for screenshots
  const st = q.get("state");
  if (st) {
    act.names();
    if (st === "stare") act.stare(0);
    else {
      act.aim(0);
      if (st === "construction") act.construction();
      if (st === "red" || st === "doubt") act.red();
    }
    window.ready = true;
  } else {
    act.names();
    window.ready = true;
    if (!reduced) setTimeout(() => act.aim(), 4 * 400);
  }
  // frame-time meter
  let last = performance.now(); const ft = [];
  (function tick(t) { ft.push(t - last); last = t; if (ft.length > 120) ft.shift(); const s = [...ft].sort((a, b) => a - b); document.getElementById("ms").textContent = `frame p50 ${s[s.length >> 1]?.toFixed(1)} ms · p95 ${s[Math.floor(s.length * 0.95)]?.toFixed(1)} ms`; requestAnimationFrame(tick); })(last);
</script>
</body>
</html>
