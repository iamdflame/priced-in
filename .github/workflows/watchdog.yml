# The live watchdog through judging: every 10 minutes it checks what a judge needs (the site, the
# free $1, the API, the keeper, the market and its NEAR for gas and storage) with scripts/watchdog.mjs,
# read only and with no secrets. The requests also keep the site's server warm. A failed run emails
# the repository owner.
name: watchdog
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: watchdog
  cancel-in-progress: true
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/watchdog.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/watchdog.mjs
